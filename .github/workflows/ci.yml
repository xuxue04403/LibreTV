name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# 只跑一台机器：typecheck / lint / vitest 加起来不到两分钟，多平台矩阵没有收益
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-and-core:
    name: 桌面端与 core（typecheck + lint + vitest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 类型检查（core + desktop node/web）
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 单元测试
        run: npm test

  androidtv:
    name: 电视端与手机端（Kotlin 单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3

      # gradlew 已提交（gradle/wrapper/gradle-wrapper.jar + properties），
      # 不依赖开发者本机装的 gradle 版本。
      # flavor 拆分后任务名带 flavor 前缀：testTvDebugUnitTest / testPhoneDebugUnitTest
      - name: Kotlin 单测（电视版 + 手机版）
        working-directory: apps/androidtv
        run: ./gradlew --no-daemon :app:testTvDebugUnitTest :app:testPhoneDebugUnitTest

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidtv-test-report
          path: |
            apps/androidtv/app/build/reports/tests/testTvDebugUnitTest
            apps/androidtv/app/build/reports/tests/testPhoneDebugUnitTest
          if-no-files-found: ignore
