appId: org.librextv.desktop
productName: LibreXTV
electronVersion: 33.4.11
copyright: AGPL-3.0-or-later · 基于 LibreSpark/LibreTV

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  # 依赖已被 vite 打进 renderer bundle，node_modules 只剩 hls.js/mpegts.js 的
  # 源文件与 source map（实测占 20MB+），全部排除
  - '!node_modules/**'
  - '!**/*.map'
  - '!**/*.ts'
  - '!**/*.md'

extraMetadata:
  main: out/main/index.js

extraResources:
  - from: resources/icon.png
    to: icon.png

asar: true

win:
  target:
    - nsis
    - portable
  # 两个目标不能共用 artifactName，否则后构建的会覆盖前一个（实测只剩便携版）
  artifactName: LibreXTV-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: LibreXTV
  artifactName: LibreXTV-Setup-${version}-${arch}.${ext}

portable:
  artifactName: LibreXTV-Portable-${version}-${arch}.${ext}

mac:
  target:
    - dmg
    - zip
  category: public.app-category.entertainment
  artifactName: LibreXTV-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  artifactName: LibreXTV-${version}-${arch}.${ext}
